name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  vulnerability-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  static-platform-smoke:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Probe and serve static paths on the native filesystem
        run: go test ./pkg/staticserve -count=1

      - name: Exercise static host routing and policy integration
        env:
          # Go's Windows test temp directory lives under LOCALAPPDATA. The
          # production gateway protects that tree, so isolate test fixtures
          # from deployment-derived protected roots in this smoke step. Keep
          # the Go build cache explicit because Go otherwise derives it from
          # LOCALAPPDATA on Windows.
          APPDATA: ""
          LOCALAPPDATA: ""
          GOCACHE: ${{ runner.temp }}/go-build
        run: go test ./pkg/proxy -run '^TestStaticHost' -count=1

  hot-benchmarks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Compare hot-path benchmark medians against the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          benchmark_pattern='Benchmark(Handler|Auth|Preflight|StreamingToolbar|RewriteHTML|Relay|UDP|ManagerLog|DailyFileWriter)'
          benchmark_args=(-p=1 -run '^$' -bench "${benchmark_pattern}" -benchmem -count=1 -benchtime=250ms -cpu=2)
          benchmark_packages=(./pkg/proxy ./pkg/rpcbridge ./pkg/stream ./pkg/gatewaylog)
          base_dir="${RUNNER_TEMP}/go-reauth-proxy-base"
          base_output="${RUNNER_TEMP}/go-hot-base.txt"
          current_output="${RUNNER_TEMP}/go-hot-current.txt"
          git fetch --no-tags origin "${BASE_SHA}" --depth=1
          git worktree add --detach "${base_dir}" "${BASE_SHA}"
          cleanup() {
            git worktree remove --force "${base_dir}" || true
          }
          trap cleanup EXIT
          : > "${base_output}"
          : > "${current_output}"
          run_base_benchmarks() {
            (
              cd "${base_dir}"
              GOMAXPROCS=2 go test "${benchmark_args[@]}" "${benchmark_packages[@]}"
            ) | tee -a "${base_output}"
          }
          run_current_benchmarks() {
            GOMAXPROCS=2 go test "${benchmark_args[@]}" "${benchmark_packages[@]}" | tee -a "${current_output}"
          }
          # Discard one full run per revision so process startup, core migration,
          # and initial CPU-frequency changes cannot split the measured medians.
          run_current_benchmarks > /dev/null
          run_base_benchmarks > /dev/null
          : > "${base_output}"
          : > "${current_output}"
          # Alternate execution order so thermal drift and shared-runner load do
          # not systematically penalize the current revision. Six independent
          # samples also prevent one long-lived test process from coupling later
          # benchmarks to the amount of work calibrated for earlier benchmarks.
          for iteration in $(seq 1 6); do
            if (( iteration % 2 == 1 )); then
              run_current_benchmarks
              run_base_benchmarks
            else
              run_base_benchmarks
              run_current_benchmarks
            fi
          done
          go run ./tools/benchcheck \
            --base "${base_output}" \
            --current "${current_output}" \
            --max-latency-regression 0.05 \
            --max-bytes-regression 0.05 \
            --max-allocs-regression 0.05 \
            --max-allocs-absolute-regression 1

  race:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Race detector
        run: go test -race ./...
