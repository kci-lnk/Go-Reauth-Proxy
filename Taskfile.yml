version: '3'

tasks:
  default:
    desc: "Build gateway binaries"
    cmds:
      - task: build

  build:
    desc: "Build gateway binaries for all platforms (macOS ARM64 & Linux AMD64/ARM64/ARM32)"
    cmds:
      - task: build:mac
      - task: build:linux
      - task: build:linux-arm64
      - task: build:linux-arm

  build:mac:
    desc: "Build the go-reauth-proxy binary for macOS (ARM64)"
    env:
      GOOS: darwin
      GOARCH: arm64
    cmds:
      - mkdir -p build
      - go build -ldflags="-s -w" -trimpath -o build/go-reauth-proxy-darwin-arm64 ./cmd/server
      - echo "Built macOS ARM64 binary at build/go-reauth-proxy-darwin-arm64"

  build:linux:
    desc: "Build the go-reauth-proxy binary for Linux (AMD64)"
    env:
      GOOS: linux
      GOARCH: amd64
    cmds:
      - mkdir -p build
      - go build -ldflags="-s -w" -trimpath -o build/go-reauth-proxy-linux-amd64 ./cmd/server
      - task: maybe:upx
        vars:
          BIN: build/go-reauth-proxy-linux-amd64
          LABEL: Linux AMD64
      - echo "Built Linux AMD64 binary at build/go-reauth-proxy-linux-amd64"

  build:linux-arm64:
    desc: "Build the go-reauth-proxy binary for Linux (ARM64)"
    env:
      GOOS: linux
      GOARCH: arm64
    cmds:
      - mkdir -p build
      - go build -ldflags="-s -w" -trimpath -o build/go-reauth-proxy-linux-arm64 ./cmd/server
      - task: maybe:upx
        vars:
          BIN: build/go-reauth-proxy-linux-arm64
          LABEL: Linux ARM64
      - echo "Built Linux ARM64 binary at build/go-reauth-proxy-linux-arm64"

  build:linux-arm:
    desc: "Build the go-reauth-proxy binary for Linux (ARM32/ARMv7)"
    env:
      GOOS: linux
      GOARCH: arm
      GOARM: "7"
    cmds:
      - mkdir -p build
      - go build -ldflags="-s -w" -trimpath -o build/go-reauth-proxy-linux-arm ./cmd/server
      - task: maybe:upx
        vars:
          BIN: build/go-reauth-proxy-linux-arm
          LABEL: Linux ARM32
      - echo "Built Linux ARM32 binary at build/go-reauth-proxy-linux-arm"

  maybe:upx:
    internal: true
    cmds:
      - |
        bin="{{.BIN}}"
        label="{{.LABEL}}"
        mode="${FN_KNOCK_GO_UPX:-0}"
        case "${mode}" in
          0|false|False|FALSE|no|No|NO|off|Off|OFF)
            echo "Skipping UPX compression for ${label} (FN_KNOCK_GO_UPX=${mode})"
            exit 0
            ;;
          auto|1|true|True|TRUE|yes|Yes|YES|on|On|ON|required)
            ;;
          *)
            echo "Unsupported FN_KNOCK_GO_UPX=${mode}; expected auto, 0, 1, or required" >&2
            exit 1
            ;;
        esac
        upx_bin="${FN_KNOCK_UPX_BIN:-$(command -v upx || true)}"
        if [ -z "${upx_bin}" ]; then
          if [ "${mode}" = "required" ]; then
            echo "UPX is required but was not found; install upx or set FN_KNOCK_GO_UPX=0" >&2
            exit 1
          fi
          echo "UPX not found; leaving ${label} binary uncompressed"
          exit 0
        fi
        set -- ${FN_KNOCK_GO_UPX_ARGS:---best --lzma}
        if ! "${upx_bin}" "$@" "${bin}"; then
          if [ "${mode}" = "required" ]; then
            echo "UPX compression failed for ${bin}; set FN_KNOCK_GO_UPX=0 to disable compression" >&2
            exit 1
          fi
          echo "UPX compression skipped for ${label}"
        fi

  run:
    desc: "Run the go-reauth-proxy server (usage: task run -- -proxy-port 8090 -admin-port 8091)"
    cmds:
      - go run ./cmd/server {{.CLI_ARGS}}

  test:
    desc: "Run all tests"
    cmds:
      - go test -v ./...

  clean:
    desc: "Clean build artifacts"
    cmds:
      - rm -rf build/
  
  stop:
    desc: "Stop the go-reauth-proxy server"
    cmds:
      - sh -c 'PID=$(lsof -ti:7999); if [ -n "$PID" ]; then kill -9 $PID; echo "Server stopped."; else echo "Server is not running."; fi'
  docs:
    desc: "Show internal gRPC contract location"
    cmds:
      - echo "Go internal control-plane contracts are generated in pkg/grpc/pb from the shared fnknock gRPC proto."
